name: Check site data

# Runs on every pull request. If a data file has a typo or a missing field, the check fails
# with a plain-English explanation (see the "Summary" tab of the run) and the PR can't be merged.
on:
  pull_request:
  workflow_dispatch:   # lets the image-compression workflow re-run this check after it pushes a commit

permissions:
  contents: read

jobs:
  validate:
    name: Validate data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ".ruby-version"
      - name: Check every _data file
        run: ruby scripts/validate_data.rb

  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ".ruby-version"
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build
